services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smap}
      POSTGRES_USER: ${POSTGRES_USER:-smap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - smap_production_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smap} -d ${POSTGRES_DB:-smap}"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production.local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smap}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smap}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  smap_production_postgres:
