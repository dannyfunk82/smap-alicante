services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smap}
      POSTGRES_USER: ${POSTGRES_USER:-smap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smap_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - smap_web_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smap} -d ${POSTGRES_DB:-smap}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smap}:${POSTGRES_PASSWORD:-smap_dev_password}@db:5432/${POSTGRES_DB:-smap}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  smap_web_postgres:
