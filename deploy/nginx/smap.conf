server {
    listen 80;
    server_name smap.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name smap.example.com;

    ssl_certificate /etc/letsencrypt/live/smap.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smap.example.com/privkey.pem;

    client_max_body_size 2m;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:3000/api/health;
        access_log off;
    }

    location = /api/ready {
        proxy_pass http://127.0.0.1:3000/api/ready;
        access_log off;
    }
}
